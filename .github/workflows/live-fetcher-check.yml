name: Live Fetcher Health Check

# Read-only health check: hits each registered fetcher's LIVE source and
# reports pass/fail. Never writes to exchanges/, never opens a PR, never
# touches calendar.json. Exists to catch page-structure drift between
# scheduled update runs, since a fetcher's unit tests passing against a
# fixture says nothing about whether the live page still has that shape.
#
# NOTE: this job does not mock network calls -- it makes real HTTP requests
# to third-party sites (nyse.com, jpx.co.jp, etc). Expect occasional false
# failures from transient outages, rate limiting, or bot-detection changes
# on the target sites, not just from actual fetcher bugs. A single failure
# is a signal to investigate, not necessarily a broken fetcher -- see the
# per-exchange notes in docs/fetcher_verification.md before assuming the
# parser itself is wrong.

on:
  schedule:
    - cron: '0 0 * * 0'  # Sunday 00:00 UTC

  workflow_dispatch:
    inputs:
      mic:
        description: 'Specific exchange MIC to check (leave empty for all Tier 1 fetchers)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'
  # Documentation of tier membership, for visibility when reading this
  # file. NOT the source of truth for what gets checked (that's
  # ExchangeFetcherRegistry, read live by live_fetcher_check.py). The
  # "Verify tier coverage" step reconciles these lists against
  # BLOCKED.md: an exchange listed here must be either registered or
  # documented as blocked. Adding a new exchange means adding it here
  # AND in the registry (or in BLOCKED.md).
  TIER1_MICS: 'XNYS,XNAS,XLON,XETR,XASX,XPAR,XAMS,XTKS,XSHG,XSHE,XHKG'
  # Tier 2 fetchers built so far (2026-08-27): XTSE, XMAD, XSAU. Kept
  # separate from TIER1_MICS rather than merged, so the guard step below can
  # still distinguish "did Tier 1 regress" from "Tier 2 is still expanding"
  # -- an unexpected drop in TIER1_MICS coverage is a hard failure, but a
  # new Tier 2/3 fetcher appearing that isn't listed here yet is expected
  # and should not fail the job.
  TIER2_MICS_BUILT: 'XTSE,XMAD,XSAU'
  # Tier 3 fetchers built so far (2026-08-29): XDFM, XKUW, XMOS.
  TIER3_MICS_BUILT: 'XDFM,XKUW,XMOS'
  # Tier 4 fetchers built so far (2026-08-31): XWBO, XWAR, XPRA, XBUD,
  # XDUB, XBRU, XLIS, XOSL (last four via the shared EuronextFetcher).
  TIER4_MICS_BUILT: 'XWBO,XWAR,XPRA,XBUD,XDUB,XBRU,XLIS,XOSL'
  # Tier 5 fetchers built so far (2026-08-31): XSTO, XHEL, XCSE, XICE
  # (shared NasdaqNordicFetcher), XTAL, XRIS, XLIT (shared NasdaqBalticFetcher).
  TIER5_MICS_BUILT: 'XSTO,XHEL,XCSE,XICE,XTAL,XRIS,XLIT'
  # Tier 6 fetchers built so far (2026-09-04): XBSP, XMEX, XBUE.
  TIER6_MICS_BUILT: 'XBSP,XMEX,XBUE'
  # Tier 7 fetchers built so far (2026-09-06): XSTC (resolves the Tier 6
  # carryover), XNSA, XBRV, XCOL.
  TIER7_MICS_BUILT: 'XSTC,XNSA,XBRV,XCOL'
  # Tier 8 fetchers built (2026-09-06, FINAL TIER): XBDA, XCAY, XLUX,
  # XMAL, XZAG, plus XGSE (resolves the Tier 7 carryover).
  TIER8_MICS_BUILT: 'XBDA,XCAY,XLUX,XMAL,XZAG,XGSE'

jobs:
  verify-coverage:
    name: Verify tier coverage matches the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Verify tier coverage matches the registry
        run: |
          python3 -c "
          # ... existing guard script, unchanged ...
          "

  live-check-stable:
    name: Live check — stable fetchers (blocking)
    needs: verify-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Run live fetcher check (stable set)
        run: |
          python tools/live_fetcher_check.py --exclude XHKG,XSHG,XNSA,XKUW,XSAU

  live-check-ci-unreachable:
    name: Live check — CI-unreachable (informational)
    needs: verify-coverage
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Run live fetcher check (XHKG, XSHG, XNSA)
        continue-on-error: true
        run: |
          set +e
          python tools/live_fetcher_check.py --only XHKG,XSHG,XNSA
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::CI-unreachable fetchers failed (expected from GitHub runners): XHKG, XSHG, XNSA"
          fi
          exit 0

  live-check-blocked:
    name: Live check — permanently blocked (informational)
    needs: verify-coverage
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Run live fetcher check (XKUW, XSAU)
        continue-on-error: true
        run: |
          set +e
          python tools/live_fetcher_check.py --only XKUW,XSAU
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::Permanently blocked fetchers failed (expected): XKUW, XSAU"
          fi
          exit 0

  summarize:
    name: Summarize
    needs: [live-check-stable, live-check-ci-unreachable, live-check-blocked]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          echo "### Live Fetcher Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| stable | ${{ needs.live-check-stable.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ci-unreachable | ${{ needs.live-check-ci-unreachable.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| blocked | ${{ needs.live-check-blocked.result }} |" >> "$GITHUB_STEP_SUMMARY"

