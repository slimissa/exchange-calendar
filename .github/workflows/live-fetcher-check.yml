name: Live Fetcher Health Check

# Read-only health check: hits each registered fetcher's LIVE source and
# reports pass/fail. Never writes to exchanges/, never opens a PR, never
# touches calendar.json. Exists to catch page-structure drift between
# scheduled update runs, since a fetcher's unit tests passing against a
# fixture says nothing about whether the live page still has that shape.
#
# NOTE: this job does not mock network calls -- it makes real HTTP requests
# to third-party sites (nyse.com, jpx.co.jp, etc). Since 4b3 the check
# classifies each fetcher (tools/live_fetcher_check.py): TRANSIENT (the site
# had a bad day: fetch errors, timeouts, 5xx, an empty or maintenance page;
# retried 3 times in the run) or FAIL (deterministic: validation errors,
# conflicting rows, a parse error on a page with content). On the schedule,
# tools/live_check_escalate.py fails the workflow when a fetcher FAILs, or is
# TRANSIENT in two consecutive scheduled runs, and keeps one issue (label
# `live-check`, title "Live fetcher check failing") with the summary table and
# the per-MIC streaks; the next fully green scheduled run closes it. The
# issue body is the only state: no commits from CI.

on:
  schedule:
    - cron: '0 0 * * 0'  # Sunday 00:00 UTC

  workflow_dispatch:
    inputs:
      mic:
        description: 'Specific exchange MIC to check (leave empty for all Tier 1 fetchers)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'
  # Documentation of tier membership, for visibility when reading this
  # file. NOT the source of truth for what gets checked (that's
  # ExchangeFetcherRegistry, read live by live_fetcher_check.py). The
  # "Verify tier coverage" step reconciles these lists against
  # BLOCKED.md: an exchange listed here must be either registered or
  # documented as blocked. Adding a new exchange means adding it here
  # AND in the registry (or in BLOCKED.md).
  TIER1_MICS: 'XNYS,XNAS,XLON,XETR,XASX,XPAR,XAMS,XTKS,XSHG,XSHE,XHKG'
  # Tier 2 fetchers built so far (2026-08-27): XTSE, XMAD, XSAU. Kept
  # separate from TIER1_MICS rather than merged, so the guard step below can
  # still distinguish "did Tier 1 regress" from "Tier 2 is still expanding"
  # -- an unexpected drop in TIER1_MICS coverage is a hard failure, but a
  # new Tier 2/3 fetcher appearing that isn't listed here yet is expected
  # and should not fail the job.
  TIER2_MICS_BUILT: 'XTSE,XMAD,XSAU'
  # Tier 3 fetchers built so far (2026-08-29): XDFM, XKUW, XMOS.
  TIER3_MICS_BUILT: 'XDFM,XKUW,XMOS'
  # Tier 4 fetchers built so far (2026-08-31): XWBO, XWAR, XPRA, XBUD,
  # XDUB, XBRU, XLIS, XOSL (last four via the shared EuronextFetcher).
  TIER4_MICS_BUILT: 'XWBO,XWAR,XPRA,XBUD,XDUB,XBRU,XLIS,XOSL'
  # Tier 5 fetchers built so far (2026-08-31): XSTO, XHEL, XCSE, XICE
  # (shared NasdaqNordicFetcher), XTAL, XRIS, XLIT (shared NasdaqBalticFetcher).
  TIER5_MICS_BUILT: 'XSTO,XHEL,XCSE,XICE,XTAL,XRIS,XLIT'
  # Tier 6 fetchers built so far (2026-09-04): XBSP, XMEX, XBUE.
  TIER6_MICS_BUILT: 'XBSP,XMEX,XBUE'
  # Tier 7 fetchers built so far (2026-09-06): XSTC (resolves the Tier 6
  # carryover), XNSA, XBRV, XCOL.
  TIER7_MICS_BUILT: 'XSTC,XNSA,XBRV,XCOL'
  # Tier 8 fetchers built (2026-09-06, FINAL TIER): XBDA, XCAY, XLUX,
  # XMAL, XZAG, plus XGSE (resolves the Tier 7 carryover).
  TIER8_MICS_BUILT: 'XBDA,XCAY,XLUX,XMAL,XZAG,XGSE'

jobs:
  verify-coverage:
    name: Verify tier coverage matches the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Verify tier coverage matches the registry
        # Restored in 4b3 (commit 2994f2c had left a placeholder comment here,
        # so the step checked nothing).
        run: python3 tools/check_tier_coverage.py

  live-check-stable:
    name: Live check — stable fetchers (blocking)
    needs: verify-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STABLE_EXCLUDE: XHKG,XSHG,XNSA,XKUW,XSAU,XSWX,XBUL
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Run live fetcher check (single MIC, manual run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mic != ''
        run: python tools/live_fetcher_check.py --mic "${{ github.event.inputs.mic }}"
      - name: Run live fetcher check (stable set, manual run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mic == ''
        run: python tools/live_fetcher_check.py --exclude "$STABLE_EXCLUDE"
      - name: Run live fetcher check (stable set, scheduled)
        if: github.event_name == 'schedule'
        # Exit status is decided by the escalation step, not here: a single
        # transient failure does not fail the scheduled run.
        run: |
          set +e
          python tools/live_fetcher_check.py --exclude "$STABLE_EXCLUDE" --json-out live-results.json
          echo "check exit code: $?"
          test -s live-results.json
      - name: Escalate across scheduled runs (one issue, label live-check)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          title="Live fetcher check failing"
          num="$(gh issue list --label live-check --state open --limit 20 --json number,title \
                  --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ -n "$num" ]; then gh issue view "$num" --json body --jq .body > prev-body.md; else : > prev-body.md; fi
          python tools/live_check_escalate.py --results live-results.json --previous-body prev-body.md \
            --body-out body.md --decision-out decision.json --run-url "$RUN_URL"
          action="$(python -c "import json; print(json.load(open('decision.json'))['action'])")"
          escalate="$(python -c "import json; print(str(json.load(open('decision.json'))['escalate']).lower())")"
          if [ "$action" = close ] && [ -n "$num" ]; then
            gh issue close "$num" --comment "Fully green scheduled run: $RUN_URL"
          elif [ "$action" = upsert ]; then
            gh label create live-check --color B60205 --description "Weekly live fetcher check" 2>/dev/null || true
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file body.md
            else
              gh issue create --title "$title" --label live-check --body-file body.md
            fi
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$escalate" = true ]; then
            echo "::error::Live fetcher check escalated: a deterministic failure, or a transient failure in two consecutive scheduled runs"
            exit 1
          fi

  live-check-ci-unreachable:
    name: Live check — CI-unreachable (informational)
    needs: verify-coverage
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Install Playwright Chromium (XSWX and XBUL render their pages)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run live fetcher check (XHKG, XSHG, XNSA, XSWX, XBUL)
        continue-on-error: true
        run: |
          set +e
          python tools/live_fetcher_check.py --only XHKG,XSHG,XNSA,XSWX,XBUL
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::CI-unreachable fetchers failed (expected from GitHub runners, or XSWX and XBUL not yet verified from CI): XHKG, XSHG, XNSA, XSWX, XBUL"
          fi
          exit 0

  live-check-blocked:
    name: Live check — blocked (informational)
    needs: verify-coverage
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Run live fetcher check (XKUW, XSAU)
        continue-on-error: true
        run: |
          set +e
          python tools/live_fetcher_check.py --only XKUW,XSAU
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::Blocked fetchers failed (expected for now): XKUW, XSAU. A pass means they can be reopened; see BLOCKED.md."
          fi
          exit 0

  summarize:
    name: Summarize
    needs: [live-check-stable, live-check-ci-unreachable, live-check-blocked]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          echo "### Live Fetcher Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| stable | ${{ needs.live-check-stable.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ci-unreachable | ${{ needs.live-check-ci-unreachable.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| blocked | ${{ needs.live-check-blocked.result }} |" >> "$GITHUB_STEP_SUMMARY"

