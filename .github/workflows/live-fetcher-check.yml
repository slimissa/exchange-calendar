name: Live Fetcher Health Check

# Read-only health check: hits each registered fetcher's LIVE source and
# reports pass/fail. Never writes to exchanges/, never opens a PR, never
# touches calendar.json. Exists to catch page-structure drift between
# scheduled update runs, since a fetcher's unit tests passing against a
# fixture says nothing about whether the live page still has that shape.
#
# NOTE: this job does not mock network calls -- it makes real HTTP requests
# to third-party sites (nyse.com, jpx.co.jp, etc). Expect occasional false
# failures from transient outages, rate limiting, or bot-detection changes
# on the target sites, not just from actual fetcher bugs. A single failure
# is a signal to investigate, not necessarily a broken fetcher -- see the
# per-exchange notes in docs/fetcher_verification.md before assuming the
# parser itself is wrong.

on:
  schedule:
    - cron: '0 0 * * 0'  # Sunday 00:00 UTC

  workflow_dispatch:
    inputs:
      mic:
        description: 'Specific exchange MIC to check (leave empty for all Tier 1 fetchers)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'
  # Documentation of what's currently registered, for visibility when
  # reading this file -- NOT the actual source of truth for what gets
  # checked (that's ExchangeFetcherRegistry, read live by
  # live_fetcher_check.py). The "Verify Tier 1 coverage" step below fails
  # the job if this list and the registry ever disagree, so this can't
  # silently go stale the way a hardcoded check-list would.
  TIER1_MICS: 'XNYS,XNAS,XLON,XETR,XASX,XPAR,XAMS,XTKS,XSHG,XSHE,XHKG'
  # Tier 2 fetchers built so far (2026-08-27): XTSE, XMAD, XSAU. Kept
  # separate from TIER1_MICS rather than merged, so the guard step below can
  # still distinguish "did Tier 1 regress" from "Tier 2 is still expanding"
  # -- an unexpected drop in TIER1_MICS coverage is a hard failure, but a
  # new Tier 2/3 fetcher appearing that isn't listed here yet is expected
  # and should not fail the job.
  TIER2_MICS_BUILT: 'XTSE,XMAD,XSAU'
  # Tier 3 fetchers built so far (2026-08-29): XDFM, XKUW, XMOS.
  TIER3_MICS_BUILT: 'XDFM,XKUW,XMOS'
  # Tier 4 fetchers built so far (2026-08-31): XWBO, XWAR, XPRA, XBUD,
  # XDUB, XBRU, XLIS, XOSL (last four via the shared EuronextFetcher).
  TIER4_MICS_BUILT: 'XWBO,XWAR,XPRA,XBUD,XDUB,XBRU,XLIS,XOSL'
  # Tier 5 fetchers built so far (2026-08-31): XSTO, XHEL, XCSE, XICE
  # (shared NasdaqNordicFetcher), XTAL, XRIS, XLIT (shared NasdaqBalticFetcher).
  TIER5_MICS_BUILT: 'XSTO,XHEL,XCSE,XICE,XTAL,XRIS,XLIT'
  # Tier 6 fetchers built so far (2026-09-04): XBSP, XMEX, XBUE.
  TIER6_MICS_BUILT: 'XBSP,XMEX,XBUE'
  # Tier 7 fetchers built so far (2026-09-06): XSTC (resolves the Tier 6
  # carryover), XNSA, XBRV, XCOL.
  TIER7_MICS_BUILT: 'XSTC,XNSA,XBRV,XCOL'
  # Tier 8 fetchers built (2026-09-06, FINAL TIER): XBDA, XCAY, XLUX,
  # XMAL, XZAG, plus XGSE (resolves the Tier 7 carryover).
  TIER8_MICS_BUILT: 'XBDA,XCAY,XLUX,XMAL,XZAG,XGSE'

jobs:
  live-check:
    name: Check fetchers against live sites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Verify Tier 1 coverage matches the registry
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'tools')
          from update_from_exchange import ExchangeFetcherRegistry

          tier1_expected = set('${{ env.TIER1_MICS }}'.split(','))
          tier2_known = set('${{ env.TIER2_MICS_BUILT }}'.split(','))
          tier3_known = set('${{ env.TIER3_MICS_BUILT }}'.split(','))
          tier4_known = set('${{ env.TIER4_MICS_BUILT }}'.split(','))
          tier5_known = set('${{ env.TIER5_MICS_BUILT }}'.split(','))
          tier6_known = set('${{ env.TIER6_MICS_BUILT }}'.split(','))
          tier7_known = set('${{ env.TIER7_MICS_BUILT }}'.split(','))
          tier8_known = set('${{ env.TIER8_MICS_BUILT }}'.split(','))
          registered = set(ExchangeFetcherRegistry().list_available())

          missing_tier1 = tier1_expected - registered
          all_known = tier1_expected | tier2_known | tier3_known | tier4_known | tier5_known | tier6_known | tier7_known | tier8_known
          unexpected = registered - all_known
          if missing_tier1:
              print(f'::error::Documented Tier 1 MICs not registered (regression): {sorted(missing_tier1)}')
          if unexpected:
              print(f'::notice::Registry has fetchers beyond all documented tier lists (Tier 1-8 was the full planned scope -- verify this is intentional): {sorted(unexpected)}')
          if registered != all_known:
              missing_from_registry = all_known - registered
              if missing_from_registry:
                  print(f'::error::Documented fetchers across Tier 1-8 not found in registry (regression): {sorted(missing_from_registry)}')
          if missing_tier1:
              sys.exit(1)
          print(f'OK: all {len(tier1_expected)} documented Tier 1 fetchers are registered ({len(registered)} total registered, {len(all_known)} documented across Tiers 1-8 -- the complete planned scope).')
          "

      - name: Run live fetcher check (single MIC)
        if: github.event.inputs.mic != ''
        run: |
          python tools/live_fetcher_check.py --mic "${{ github.event.inputs.mic }}"

      - name: Run live fetcher check (all registered fetchers)
        if: github.event.inputs.mic == '' || github.event_name == 'schedule'
        run: |
          python tools/live_fetcher_check.py

      - name: Summarize in job summary
        if: always()
        run: |
          echo "### Live Fetcher Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran against live sources on $(date -u +%Y-%m-%dT%H:%M:%SZ)." >> "$GITHUB_STEP_SUMMARY"
          echo "See the job log above for the per-fetcher pass/fail table." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A failure here means either: (1) the live page's structure" >> "$GITHUB_STEP_SUMMARY"
          echo "changed and the fetcher's parser needs updating, or (2) a" >> "$GITHUB_STEP_SUMMARY"
          echo "transient issue (rate limit, outage, bot-detection change)" >> "$GITHUB_STEP_SUMMARY"
          echo "on the target site. Check docs/fetcher_verification.md for" >> "$GITHUB_STEP_SUMMARY"
          echo "known caveats before assuming it's (1)." >> "$GITHUB_STEP_SUMMARY"
