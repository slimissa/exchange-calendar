name: Update Exchange Calendar Data

on:
  schedule:
    - cron: '0 0 * * 0'
  
  workflow_dispatch:
    inputs:
      exchange:
        description: 'Specific exchange MIC to update (leave empty for all)'
        required: false
        default: ''
      force:
        description: 'Force update (bypass cache)'
        required: false
        type: boolean
        default: false
  
  push:
    branches:
      - main
    paths:
      - 'exchanges/**'
      - 'tools/update_from_exchange.py'
      - 'tools/requirements.txt'

env:
  PYTHON_VERSION: '3.12'

jobs:
  validate:
    name: Validate Registry
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          else
            echo "tools/requirements.txt not found, installing minimal dependencies"
            pip install requests beautifulsoup4 tqdm pytest
          fi
      
      - name: Validate registry
        run: |
          python tools/validate.py
      
      - name: Run existing tests
        run: |
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests failed"
      
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            test-results/
            validation-report.json
          if-no-files-found: ignore
          retention-days: 14

  update:
    name: Update Exchange Data
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          else
            pip install requests beautifulsoup4 tqdm
          fi
      
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Update exchanges (dry run)
        run: |
          if [ -n "${{ github.event.inputs.exchange }}" ]; then
            python tools/update_from_exchange.py \
              --exchange ${{ github.event.inputs.exchange }} \
              --dry-run \
              --verbose
          else
            python tools/update_from_exchange.py \
              --all \
              --dry-run \
              --verbose
          fi
      
      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet exchanges/; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git diff --stat exchanges/
          fi
      
      - name: Create Pull Request
        if: steps.check-changes.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update exchange calendar data [automated]"
          branch: automated/update-exchange-data
          delete-branch: true
          title: "📅 Automated exchange calendar update"
          body: |
            ## Automated Exchange Calendar Update
            
            This PR was automatically generated by the update workflow.
            
            ### Validation
            - ✅ Schema validation passed
            - ✅ All tests passed
            
            ### Review Checklist
            - [ ] Verify holiday dates are correct
            - [ ] Check source URLs are valid
            - [ ] Confirm no unexpected changes
          labels: |
            automated
            data-update
            needs-review

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [validate, update]
    if: always()
    
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.validate.result }}" = "success" ] && [ "${{ needs.update.result }}" = "success" ]; then
            echo "✅ All jobs passed"
          elif [ "${{ needs.validate.result }}" = "success" ] && [ "${{ needs.update.result }}" = "skipped" ]; then
            echo "✅ Validation passed, update skipped (not scheduled)"
          else
            echo "❌ Workflow failed"
            exit 1
          fi
